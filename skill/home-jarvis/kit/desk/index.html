<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Jarvis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jarvis" content="__TOKEN__">
<link rel="stylesheet" href="/desk/desk.css">
</head><body data-view="core" data-mode="idle">
<canvas id="gl"></canvas>
<div class="top">
  <div class="brand"><i class="dot"></i>JARVIS</div>
  <div class="state" id="state"></div><i class="shim top"></i>
  <div class="tabs" id="tabs">
    <button data-s="core">Core</button><button data-s="today">Today</button><button data-s="prayer">Prayer</button>
    <button data-s="paper">Paper</button><button data-s="knowledge">Knowledge</button><button data-s="voices">Voices</button>
    <button data-s="settings">Settings</button><i class="sep"></i><button id="lockTab">Lock</button>
  </div>
</div>
<div id="panel" hidden></div>
<div class="chat" id="chat"><div class="sp"></div></div>
<div class="caption" id="caption"></div>
<div class="card" id="card" hidden></div>
<div class="bar">
  <button class="mic" id="mic" title="Talk to Jarvis" aria-label="Talk"></button>
  <input id="input" placeholder="Talk, or type here" autocomplete="off" spellcheck="false" maxlength="2000">
</div>
<dialog id="pindlg">
  <form method="dialog" id="pinform">
    <h3 id="pintitle">Jarvis PIN</h3>
    <p class="sub" id="pinhelp">Type your Jarvis PIN.</p>
    <input id="pin" class="fld wide" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <p class="sub bad" id="pinerr"></p>
    <div class="acts"><button class="solid" value="ok">OK</button><button class="ghost" value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>
<script src="/desk/desk.js"></script>
</body></html>
