<!doctype html>
<html><head><meta charset="utf-8"><title>Jarvis · Look lab</title>
<!-- Phase 4.1 look lab (12 Nov 2026): three live previews of the new look. Hidden page, nothing else uses it.
     Open: type "look lab" in Jarvis's box, or jarvis://app/look-lab.html. Keys 1 2 3 switch, H hides this bar, Esc goes back. -->
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<style>
:root{--sys:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--txt:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#04070b;color:#eef6fb;overflow:hidden;-webkit-user-select:none;font:500 15px/1.45 var(--sys)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}#ui svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s ease}#fade.on{opacity:1}
/* ---------- The lab's own bar (not part of any look) ---------- */
#lab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:999px;background:rgba(22,24,28,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);font:600 12px/1 var(--txt);color:#c9ced4;z-index:9;transition:opacity .25s}
#lab.hide{opacity:0;pointer-events:none}
#lab .t{letter-spacing:.14em;text-transform:uppercase;font:700 10.5px var(--mono);color:#8f969e}
#lab .seg{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:999px;padding:2px}
#lab button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;color:#c9ced4;font:650 12.5px var(--txt);transition:background .15s,color .15s,transform .1s}
#lab button:active{transform:scale(.96)}#lab button:hover{color:#fff}
#lab .seg button.on{background:rgba(255,255,255,.9);color:#0b0d10}
#lab .prog{width:70px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}#lab .prog i{display:block;height:100%;width:100%;background:rgba(255,255,255,.75);transform-origin:left;transform:scaleX(0)}
#lab .fps{font:700 11px var(--mono);color:#8f969e;min-width:46px;text-align:right}
#lab .back{border:1px solid rgba(255,255,255,.14)}
#rm{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);font:600 11.5px var(--txt);color:#8f969e}
/* ---------- Shared pieces (each look restyles them below) ---------- */
.hd{position:absolute;left:28px;right:28px;top:20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:24px;height:24px}
.st{display:flex;align-items:center;gap:8px}.st i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.tabs{margin-left:auto;display:flex;gap:4px}.tabs b{font-weight:inherit}
.card{position:absolute;will-change:transform,opacity;opacity:0}
.cap{position:absolute}.cap .w{display:inline-block;animation:wIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes wIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.heard{transition:opacity .4s}.said{transition:opacity .4s}

/* =========== A · ARC: today's navy and cyan, grown up =========== */
body[data-look=arc]{--a:#37e0ff;background:#03060a}
[data-look=arc] .hd{font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}
[data-look=arc] .brand span{font:800 15px var(--sys);letter-spacing:.34em}
[data-look=arc] .st{color:var(--sc,#37e0ff);font:700 11px var(--mono);letter-spacing:.16em;padding:5px 11px;border:1px solid color-mix(in srgb,var(--sc,#37e0ff) 40%,transparent);border-radius:999px;background:rgba(4,10,16,.6);text-shadow:0 0 12px var(--sc,#37e0ff)}
[data-look=arc] .st i{box-shadow:0 0 10px currentColor}
[data-look=arc] .tabs b{padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(10,18,26,.55);color:#a9bccb;font:700 11px var(--mono);letter-spacing:.1em;backdrop-filter:blur(12px)}
[data-look=arc] .tabs b.on{color:#fff;border-color:var(--a);box-shadow:0 0 14px -3px var(--a),inset 0 0 10px -6px var(--a)}
[data-look=arc] time{font:700 12px var(--mono);color:#7f98aa;letter-spacing:.12em}
[data-look=arc] .card{left:28px;bottom:92px;width:340px;padding:14px 16px 12px;border-radius:14px;background:linear-gradient(180deg,rgba(14,26,38,.72),rgba(6,12,18,.72));border:1px solid rgba(55,224,255,.35);box-shadow:0 0 30px -10px var(--a),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px)}
[data-look=arc] .card::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--a),transparent)}
[data-look=arc] .card .k{font:700 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--a);margin-bottom:8px}
[data-look=arc] .card .r{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14px}
[data-look=arc] .card .r span{color:#8ea6b6;font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}[data-look=arc] .card .r b{font-weight:700}
[data-look=arc] .cap{left:22%;right:22%;bottom:96px;text-align:center}
[data-look=arc] .heard{color:#9fb6c6;font:600 15px var(--sys);margin-bottom:6px}
[data-look=arc] .said{font:750 22px/1.3 var(--sys);text-shadow:0 2px 18px #000}[data-look=arc] .said .w:last-child{color:#fff;text-shadow:0 0 14px var(--a)}
[data-look=arc] .ro{position:absolute;left:0;top:0;font:700 10px var(--mono);letter-spacing:.14em;color:#6f8a9d;text-transform:uppercase;white-space:nowrap}
[data-look=arc] .ro b{display:block;text-transform:none;font:700 17px var(--mono);letter-spacing:.02em;color:#dff6ff;margin-top:3px}
[data-look=arc] .ro.r{text-align:right}
[data-look=arc] #inst line,[data-look=arc] #inst path{stroke:#37e0ff;stroke-width:1;fill:none;opacity:.55}
[data-look=arc] #inst .dim{opacity:.22}

/* =========== B · OBSIDIAN: near-black glass, one warm accent, calm type =========== */
body[data-look=obsidian]{--w:#ffbe6b;background:#060607}
[data-look=obsidian] .hd{top:26px;left:56px;right:56px;font:500 13px var(--txt);color:#8b8a88}
[data-look=obsidian] .brand img{display:none}[data-look=obsidian] .brand span{font:600 17px var(--sys);letter-spacing:.01em;color:#f2efe9}
[data-look=obsidian] .st{display:none}
[data-look=obsidian] .tabs{gap:22px}[data-look=obsidian] .tabs b{color:#77746f;font-weight:500;padding-bottom:4px;border-bottom:1px solid transparent}[data-look=obsidian] .tabs b.on{color:#f2efe9;border-color:var(--w)}
[data-look=obsidian] time{color:#77746f;font:500 13px var(--txt);margin-left:14px;font-variant-numeric:tabular-nums}
[data-look=obsidian] .big{position:absolute;left:56px;top:22%;width:min(44vw,640px)}
[data-look=obsidian] .big .day{font:600 12px var(--txt);letter-spacing:.18em;text-transform:uppercase;color:#77746f}
[data-look=obsidian] .big h1{margin:14px 0 0;font:250 clamp(44px,5.6vw,84px)/1.02 var(--sys);letter-spacing:-.035em;color:#f4f1ec}
[data-look=obsidian] .big .line{height:1px;width:72px;background:var(--w);margin:30px 0 26px;opacity:.85}
[data-look=obsidian] .ost{display:flex;align-items:center;gap:10px;font:500 13px var(--txt);color:#9b9893;letter-spacing:.02em}
[data-look=obsidian] .ost i{width:6px;height:6px;border-radius:50%;background:var(--w);box-shadow:0 0 calc(4px + var(--lv,0)*16px) var(--w);transform:scale(calc(1 + var(--lv,0)*.8))}
[data-look=obsidian] .cap{position:relative;margin-top:18px;min-height:140px}
[data-look=obsidian] .heard{font:400 22px/1.35 var(--sys);color:#8b8984;letter-spacing:-.01em}
[data-look=obsidian] .said{font:300 clamp(24px,2.4vw,34px)/1.28 var(--sys);color:#f2efe9;letter-spacing:-.015em}
[data-look=obsidian] .card{right:56px;bottom:56px;width:320px;padding:18px 20px;border-radius:20px;background:rgba(18,18,20,.58);border:1px solid rgba(255,255,255,.07);box-shadow:0 30px 60px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(30px) saturate(140%)}
[data-look=obsidian] .card .k{font:600 11px var(--txt);letter-spacing:.16em;text-transform:uppercase;color:var(--w);margin-bottom:12px}
[data-look=obsidian] .card .r{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);font:400 15px var(--txt);color:#f2efe9}
[data-look=obsidian] .card .r span{color:#7b7974}[data-look=obsidian] .card .r b{font-weight:500}

/* =========== C · ATLAS: the house, room and car as the stage =========== */
body[data-look=atlas]{--a:#7fe3ff;background:#05080c}
[data-look=atlas] .hd{font:600 12px var(--txt)}
[data-look=atlas] .brand span{font:700 14px var(--sys);letter-spacing:.3em}
[data-look=atlas] .st{color:var(--sc,#7fe3ff);font:600 12px var(--txt);letter-spacing:.06em}
[data-look=atlas] .tabs b{padding:6px 12px;border-radius:999px;color:#9fb0bd;background:rgba(12,18,24,.5);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px)}
[data-look=atlas] .tabs b.on{color:#fff;background:rgba(127,227,255,.14);border-color:rgba(127,227,255,.5)}
[data-look=atlas] time{color:#8396a4;font:600 12px var(--txt);font-variant-numeric:tabular-nums}
[data-look=atlas] .pin{position:absolute;left:0;top:0;will-change:transform,opacity,filter;white-space:nowrap}
[data-look=atlas] .pin .lb{position:absolute;left:0;bottom:46px;transform:translateX(-50%);padding:6px 10px 6px 9px;border-radius:10px;background:rgba(10,16,22,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);font:600 12px var(--txt);color:#e6f2f8}
[data-look=atlas] .pin .lb small{display:block;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#7e93a2;margin-bottom:1px}
[data-look=atlas] .pin .dt{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a)}
[data-look=atlas] .pin .ln{position:absolute;left:0;bottom:4px;width:1px;height:42px;background:linear-gradient(transparent,var(--a));opacity:.7}
[data-look=atlas] .pin.hot .lb{border-color:rgba(127,227,255,.6);box-shadow:0 0 22px -6px var(--a)}
[data-look=atlas] .card{left:0;top:0;width:300px;padding:13px 15px;border-radius:14px;background:rgba(10,16,22,.7);border:1px solid rgba(127,227,255,.4);box-shadow:0 20px 40px -18px #000,0 0 26px -12px var(--a);backdrop-filter:blur(18px)}
[data-look=atlas] .card .k{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--a);margin-bottom:7px}
[data-look=atlas] .card .r{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid rgba(255,255,255,.07);font:500 13.5px var(--txt)}[data-look=atlas] .card .r span{color:#8ba0ae}[data-look=atlas] .card .r b{font-weight:650}
[data-look=atlas] #lead line{stroke:var(--a);stroke-width:1;opacity:.6}[data-look=atlas] #lead circle{fill:var(--a)}
[data-look=atlas] .cap{left:24%;right:24%;bottom:96px;text-align:center}
[data-look=atlas] .heard{color:#a3b4c0;font:500 15px var(--txt);margin-bottom:6px}
[data-look=atlas] .said{font:650 21px/1.3 var(--sys);text-shadow:0 2px 16px #000}

@media (max-width:900px){[data-look=obsidian] .big{width:auto;right:56px;top:16%}[data-look=arc] .cap,[data-look=atlas] .cap{left:24px;right:24px}.tabs{display:none}}
@media (prefers-reduced-motion:reduce){.cap .w{animation:none}#fade{transition:none}}
</style></head><body data-look="arc">
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="fade"></div>
<div id="rm" hidden>Reduced motion is on, so movement is slowed right down.</div>
<div id="lab">
 <span class="t">Look lab</span>
 <div class="seg"><button data-l="arc">A · Arc</button><button data-l="obsidian">B · Obsidian</button><button data-l="atlas">C · Atlas</button></div>
 <div class="prog" title="10-second scene"><i id="prog"></i></div>
 <span class="fps" id="fps">– fps</span>
 <button class="back" id="back">Back to Jarvis</button>
</div>
<script type="module" src="./look-lab.js"></script>
</body></html>
